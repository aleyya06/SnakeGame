<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game Web</title>

    <!-- Memuat Script CheerpJ untuk menjalankan program Java (Swing) langsung di Browser -->
    <script src="https://cj3.leaningtech.com/3.0/cj3loader.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
        }

        h2 {
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #game-container {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            overflow: hidden;
            background: #111;
            /* Ukuran frame disesuaikan dengan JFrame Java kita: 729x652 karena window borders */
            width: 713px;
            height: 613px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #loading {
            text-align: center;
            position: absolute;
            z-index: 10;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #bdc3c7;
        }
    </style>
</head>

<body>

    <h2>🐍 Snake Game 🐍</h2>

    <!-- Tempat Game Java akan dimunculkan -->
    <div id="game-container">
        <div id="loading">
            <div class="spinner"></div>
            <div id="loading-text">Memuat Game Java di Web...<br><small>Tunggu sebentar (mendownload engine...)</small>
            </div>
        </div>
    </div>

    <div class="instructions">
        Tekan ke area game sebelum menggunakan tombol Keyboard (W/A/S/D atau Panah)
    </div>

    <script>
        async function runGame() {
            try {
                // 1. Inisialisasi engine CheerpJ
                await cheerpjInit();

                // 2. Buat layar virtual sesuai ukuran JPanel (713x613)
                cheerpjCreateDisplay(713, 613, document.getElementById('game-container'));

                // 3. Sembunyikan loading spinner
                document.getElementById('loading').style.display = 'none';

                // 4. Jalankan class 'SnakeMain' dari file 'GameUlar.jar'
                // /app/ merujuk ke folder yang sama dengan file index.html ini
                await cheerpjRunMain("SnakeMain", "/app/GameUlar.jar");

            } catch (error) {
                console.error("Gagal menjalankan game:", error);
                document.getElementById('loading-text').innerHTML = "Gagal memuat game.<br><small>Pastikan file GameUlar.jar sudah diupload.</small>";
                document.querySelector('.spinner').style.display = 'none';
                document.getElementById('loading-text').style.color = '#ff6b6b';
            }
        }

        // Mulai proses saat halaman HTML siap
        window.onload = runGame;
    </script>

</body>

</html>
