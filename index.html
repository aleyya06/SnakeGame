<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game Web</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>🐍 Snake Game 🐍</h2>

    <!-- Port HTML/CSS/JS dari game Java: tampilan digambar ke canvas -->
    <div id="game-scale">
        <div id="game-container">
            <canvas id="game" width="713" height="613" tabindex="0" aria-label="Area permainan Snake"></canvas>
            <img id="gif-snake" class="gif-overlay" src="IMG/Snake.gif" alt="" draggable="false">
            <img id="gif-flame" class="gif-overlay" src="IMG/Flame.gif" alt="" draggable="false">
            <img id="gif-chest" class="gif-overlay" src="IMG/Chest.gif" alt="" draggable="false">
            <!-- Lapisan atas: elemen yang di Java digambar setelah GIF (tombol, panah, hint) -->
            <canvas id="game-fx" width="713" height="613" aria-hidden="true"></canvas>
            <div id="fade"></div>
            <div id="loading">
                <div class="spinner"></div>
                <div id="loading-text">Memuat Game...<br><small>Menyiapkan gambar...</small></div>
            </div>
            <div id="error" hidden>
                <div id="error-text">Gagal memuat gambar.<br><small>Cek koneksi internet lalu muat ulang halaman.</small>
                </div>
            </div>
            <div id="exit" hidden>
                <div id="exit-text">Game ditutup.<br><small>Muat ulang halaman untuk bermain lagi.</small></div>
            </div>
        </div>
    </div>

    <div class="instructions">
        Tekan ke area game sebelum menggunakan tombol Keyboard (W/A/S/D atau Panah)
    </div>

    <script src="game.js"></script>

</body>

</html>
